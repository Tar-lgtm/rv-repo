AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template to create an IAM role for an EC2 instance.'

Resources:
  MyS3AccessRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'EC2-S3-Access-Role'
      Description: 'Allows EC2 instances to call AWS S3 services.'
      
      # The Trust Policy: Defines who can assume this role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'ec2.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      
      # Managed Policies: Existing AWS policies you want to attach
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess'

      # Inline Policies: Custom policies defined inside this role
      Policies:
        - PolicyName: 'S3WritePermissions'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                Resource: 'arn:aws:s3:::my-target-bucket-name/*'

                
  

